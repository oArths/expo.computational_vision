<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Putt Party — Mini Golf</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="section">
      <div>
        <h1>Putt Party</h1>

        <div class="info">
          <p>Movimentos: <span id="moves">0</span></p>
          <p>Tempo: <span id="time">0</span>s</p>
        </div>
      </div>

      <div id="maze-container">
        <table id="maze"></table>
        <svg id="player-trail" aria-hidden="true"></svg>
        <svg id="player-token" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="46" fill="var(--color-accent-red, #e53e3e)" />
        </svg>
      </div>

      <div class="section-control">

        <div class="restart-container">
          <button id="restart" aria-label="Reiniciar jogo">Reiniciar</button>
        </div>
      </div>
    </section>

    <!-- Celebration screen -->
    <div id="celebration">
      <h2>NICE!</h2>
      <p>Você completou o buraco em <span id="celebration-moves">0</span> movimentos e <span id="celebration-time">0</span>s!</p>
      <div class="restart-container">
        <button id="celebration-restart" aria-label="Jogar novamente">Jogar novamente</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
